name: Refresh Broadway data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Refresh saved data
        run: python scripts/update_data.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Save successful refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/shows.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Broadway schedules and ticket policies"
            git push
          fi
      - name: Prepare website
        run: |
          mkdir public
          cp index.html style.css app.js planner.js favicon.svg public/
          cp -r data public/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: refresh
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish refreshed data
        id: deployment
        uses: actions/deploy-pages@v4
